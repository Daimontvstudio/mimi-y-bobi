# ============================================================================
# Exporta el juego automáticamente en cada cambio en la rama main:
#   - Versión WEB  → se publica en GitHub Pages (se juega desde el navegador del móvil)
#   - APK Android  → se adjunta a la publicación "prueba" (Releases) para instalarla
# Se puede lanzar a mano: pestaña Actions → "Exportar juego" → Run workflow.
# ============================================================================
name: Exportar juego

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Pon aquí la MISMA versión de Godot que usas en el móvil (p. ej. "4.5.1").
  GODOT_VERSION: "4.4.1"
  NOMBRE: MimiYBobi

permissions:
  contents: write   # publicar el APK en Releases
  pages: write      # publicar la versión web
  id-token: write

concurrency:
  group: exportar
  cancel-in-progress: true

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Java 17 (necesario para Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Godot y plantillas de exportación
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version

      - name: Configurar Android (clave de depuración y SDK)
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          MM=$(echo "$GODOT_VERSION" | cut -d. -f1,2)
          mkdir -p "$HOME/.config/godot"
          for f in editor_settings-4.tres "editor_settings-${MM}.tres"; do
            {
              echo '[gd_resource type="EditorSettings" format=3]'
              echo ''
              echo '[resource]'
              echo "export/android/android_sdk_path = \"$SDK\""
              echo "export/android/java_sdk_path = \"$JAVA_HOME\""
              echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
              echo 'export/android/debug_keystore_user = "androiddebugkey"'
              echo 'export/android/debug_keystore_pass = "android"'
            } > "$HOME/.config/godot/$f"
          done
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Importar recursos (imágenes y sonidos)
        run: godot --headless --import || godot --headless --editor --quit || true

      - name: Exportar versión Web
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.html

      - name: Verificar escenas y scripts
        id: verificar
        continue-on-error: true
        run: |
          mkdir -p build
          timeout 180 godot --headless -s res://herramientas/verificar.gd > build/verificacion.txt 2>&1 || true
          cat build/verificacion.txt
          grep -q "VERIF_FIN" build/verificacion.txt
          ! grep -E "SCRIPT ERROR|Parse Error|VERIF_FALLO|Failed to load script|Invalid call|Invalid access|Invalid assignment" build/verificacion.txt

      - name: Preparar publicación web
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Exportar APK de prueba
        id: apk
        continue-on-error: true   # si falla Android, la versión web se publica igual
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" "build/android/${NOMBRE}.apk"
          test -f "build/android/${NOMBRE}.apk"

      - name: Publicar APK en Releases (etiqueta "prueba")
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prueba
          name: Versión de prueba
          prerelease: true
          body: |
            APK de prueba generado automáticamente desde la rama main.
            Descárgalo desde el móvil e instálalo (permite "instalar apps desconocidas").
          files: |
            build/android/*.apk
            build/verificacion.txt
          fail_on_unmatched_files: false

  publicar-web:
    needs: exportar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4
